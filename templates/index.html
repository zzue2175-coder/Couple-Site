<script>
    document.getElementById('downloadForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const url = document.getElementById('urlInput').value;
        const resultDiv = document.getElementById('result');
        
        resultDiv.innerHTML = "ခဏစောင့်ပေးပါ၊ လင့်ခ်ဆွဲထုတ်နေပါပြီ... ❤️";
        
        try {
            const response = await fetch('/extract', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ url: url })
            });
            
            const data = await response.json();
            if (data.success) {
                resultDiv.innerHTML = `<a href="${data.video_url}" target="_blank" class="btn-download">ဗီဒီယိုကို ဒေါင်းလုဒ်လုပ်ရန် 📥</a>`;
            } else {
                resultDiv.innerHTML = `<span style="color: red;">Error: ${data.error}</span>`;
            }
        } catch (err) {
            resultDiv.innerHTML = `<span style="color: red;">လိုင်း အဆင်မပြေပါ၊ ထပ်ကြိုးစားပါဗျ။</span>`;
        }
    });
</script>
